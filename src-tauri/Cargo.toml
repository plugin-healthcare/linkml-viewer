[package]
name = "linkml-viewer"
version = "0.1.1"
description = "linkml-viewer desktop app"
authors = []
edition = "2021"

[lib]
name = "linkml_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
