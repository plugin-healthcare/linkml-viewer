name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The producer environment is the repository's locked uv project:
      # pyproject.toml + uv.lock + .python-version. uv provisions the pinned
      # Python from .python-version; `--locked` refuses a stale/missing lock, so
      # CI cannot silently re-resolve a different LinkML toolchain.
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install locked producer environment
        run: uv sync --locked

      - name: Install dependencies
        run: npm ci

      # Clean-environment proof: two independent environments from the same
      # lock must yield the same reconciled content for every bundled schema.
      - name: Verify locked producer determinism
        run: node deploy/repro-check.mjs

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
